# Render Blueprint for the Kisaniyat backend API + managed Postgres.
# Deploy: connect this repo on Render and choose "New > Blueprint".
services:
  - type: web
    name: kisaniyat-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install && npm run db:generate && npm run build:api
    startCommand: npm run db:push --workspace @kisaniyat/database && npm run start --workspace @kisaniyat/api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: kisaniyat-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        sync: false # set to your Vercel frontend URL
      - key: ENABLE_CRON
        value: "true"
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: WEATHER_API_KEY
        sync: false

databases:
  - name: kisaniyat-db
    plan: free
    databaseName: kisaniyat
